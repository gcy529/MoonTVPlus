name: Auto sync upstream & deploy

# 每 6 小时自动把上游 mtvpls:main merge 进 main，有变化就自动部署到 CF。
# 纯 GitHub Actions，无需安装任何 App。

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Sync fork with upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: mtvpls/MoonTVPlus
          upstream_sync_branch: main
          git_config_pull_rebase: 'false'

      - name: Push result
        if: steps.sync.outputs.has_new_commits == 'true'
        run: |
          git push origin main
          echo "推送完成"

  deploy:
    needs: sync
    if: needs.sync.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CF deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cloudflare-deploy.yml --ref main
          sleep 8
          gh run list --workflow=cloudflare-deploy.yml --limit 3
