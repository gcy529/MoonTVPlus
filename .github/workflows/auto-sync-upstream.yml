name: Auto sync upstream & deploy

# 定时 + push 双触发：
#  - 每 6 小时（cron 5 段格式）把上游 mtvpls:main merge 进 main（保留本地提交）
#  - 任何 push 到 main 后自动触发 CF 部署
# 纯 git 原生实现，零第三方依赖。

on:
  schedule:
    - cron: '0 */6 * * *'        # 5 段 cron：每 6 小时（UTC 0/6/12/18 点 = 北京 8/14/20/2 点）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-sync-deploy
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sync upstream (merge, never reset)
        id: sync
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git 2>/dev/null || true
          git fetch --no-tags upstream main

          # 若本仓库 main 已包含上游最新 → 无需同步
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已是最新，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "=== 上游新提交 ==="
          git log --oneline HEAD..upstream/main | head -20

          # merge（绝不用 reset/force），保留本仓库自己的提交
          if git merge --no-edit upstream/main; then
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::上游合并冲突，已中止。你的改动没有被覆盖，请手动处理。"
            git merge --abort
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  deploy:
    # 触发条件：
    #  1) push 到 main（任意来源，包括 CI 自己的 merge push）
    #  2) 定时同步产生了新 commit
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.sync.outputs.changed == 'true'
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cloudflare-deploy.yml --ref main
          sleep 10
          gh run list --workflow=cloudflare-deploy.yml --limit 3
