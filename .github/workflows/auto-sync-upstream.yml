name: Auto sync upstream & deploy

# 每 6 小时把上游 mtvpls:main merge 进 main（保留本地提交），
# 有变化就自动触发上游自带的 cloudflare-deploy.yml 部署到 CF。
# 纯 workflow，无需安装任何 GitHub App。

on:
  schedule:
    - cron: '*/6 * * * *'        # 每 6 小时（0,6,12,18 点）
  workflow_dispatch:

concurrency:
  group: auto-sync-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Merge upstream
        id: sync
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git 2>/dev/null || true
          git fetch --no-tags upstream main

          # 已包含上游最新 → 跳过
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已是最新，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "上游更新："
          git log --oneline HEAD..upstream/main | head -20

          # merge（不是 reset），保留本仓库自己的提交
          if git merge --no-edit upstream/main; then
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::上游 merge 冲突，已中止，你的改动未被覆盖"
            git merge --abort
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cloudflare-deploy.yml --ref main
          sleep 10
          gh run list --workflow=cloudflare-deploy.yml --limit 3
