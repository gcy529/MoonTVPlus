name: Auto deploy on main push

# 上游同步到 main 后，自动触发 CF 部署。
# 配合 wei/pull：它合 PR → main 有新 commit → 这里自动 deploy。

on:
  push:
    branches: [main]

concurrency:
  group: auto-deploy-main
  cancel-in-progress: false

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cloudflare-deploy.yml --ref main
          sleep 10
          gh run list --workflow=cloudflare-deploy.yml --limit 3
